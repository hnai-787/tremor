[project]
name = "ransomwatch"
version = "1.0.0"
description = "A passive host-based behavioral detector for ransomware-like file transformations"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
live = ["watchdog>=4,<5"]

[project.scripts]
ransomwatch = "ransomwatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
